name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: matcher/models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}
      - run: uv run python scripts/fetch_model.py
      - run: uv run pytest
      - run: uv run python -m matcher.eval.run --quick
