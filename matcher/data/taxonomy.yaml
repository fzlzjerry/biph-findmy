  - [navy, blue, 0.8]
  - [gray, silver, 0.8]
  - [gold, yellow, 0.7]
  - [beige, white, 0.6]
  - [beige, brown, 0.5]
  - [pink, red, 0.5]
  - [navy, black, 0.4]
  - [purple, pink, 0.4]
  - [orange, red, 0.4]
  - [orange, yellow, 0.4]
  - [purple, blue, 0.3]
  - [gray, white, 0.3]
  - [gray, black, 0.3]
  - [brown, orange, 0.3]
  - [transparent, white, 0.3]

