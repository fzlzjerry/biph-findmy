# BIPH FindMy taxonomy — owned by the Data Science Club.
#
# Every synonym is matched against *normalized* text (NFKC, lowercase, Traditional→Simplified).
# Longest match wins, so "pencil case" beats "pencil" and "笔记本电脑" beats "笔记本".
# `weak` synonyms are generic words ("bag", "包", "card"): they still count, but with lower
# confidence, and any more specific match in the same text overrides them.
#
# IMPORTANT for evaluation: never copy a word from matcher/eval/heldout.yaml into this file —
# the held-out vocabulary is how we measure robustness to words the dictionary has never seen.
